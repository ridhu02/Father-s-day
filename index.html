<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Heart Game</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial;
}

canvas{
    position:absolute;
    top:0;
    left:0;
}

/* UI */
#ui{
    position:absolute;
    width:100%;
    text-align:center;
    top:65%;
    z-index:10;
    color:white;
}

#question{
    font-size:20px;
    color:#bfe9ff;
    text-shadow:0 0 10px #4fc3ff;
}

button{
    padding:10px 22px;
    margin:8px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

#yes{ background:#00c3ff; color:white; }
#no{ background:#ff3b3b; color:white; }

#noText{
    position:fixed;
    color:#ff6b9a;
    font-weight:bold;
    display:none;
    z-index:999;
}

/* screens */
#sadScreen, #yesScreen, #hopeScreen{
    display:none;
    position:absolute;
    width:100%;
    height:100%;
    background:black;
    text-align:center;
    z-index:20;
    padding-top:80px;
    color:white;
}

img{
    width:260px;
    margin-top:20px;
    border-radius:15px;
}

#loveMsg{
    margin-top:20px;
    font-size:18px;
    min-height:60px;
    color:white;
    text-shadow:0 0 10px #4fc3ff;
}
</style>
</head>

<body>

<canvas id="c" width="1280" height="800"></canvas>

<!-- UI -->
<div id="ui">
    <div id="question">💙 Will you stay with me forever? 💙</div>
    <button id="yes">YES ❤️</button>
    <button id="no">NO 💔</button>
    <div id="noText">😏 Soch lo...</div>
</div>

<!-- SAD -->
<div id="sadScreen">
    <h1>💔 You said NO...</h1>
</div>

<!-- YES -->
<div id="yesScreen">
    <h1>💖 You are my forever 💖</h1>
    <img src="./index_files/200.webp">
 <div id="loveMsg"></div>
</div>

<!-- HOPE -->
<div id="hopeScreen">
    <h1>💔 I still hope…</h1>
    <img src="./index_files/waiting-heart-sad.gif">
</div>

<!-- MUSIC -->
<audio id="bgMusic" loop="">
    <source src="sukoon.mp3.mp3" type="audio/mpeg">
</audio>

<script>

/* ===== CANVAS ===== */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();

/* 💙 HEART */
const particles = [];
for(let i=0;i<600;i++){
    let t = (i/600)*Math.PI*2;

    let x = 16*Math.pow(Math.sin(t),3);
    let y = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);

    particles.push({
        x: Math.random()*window.innerWidth,
        y: Math.random()*window.innerHeight,
        tx: window.innerWidth/2 + x*10,
        ty: window.innerHeight/2 - y*10
    });
}

/* ⭐ STARS */
const stars = [];
for(let i=0;i<50;i++){
    stars.push({
        x: Math.random()*window.innerWidth,
        y: Math.random()*window.innerHeight,
        speed: Math.random()*1.5 + 0.5,
        len: Math.random()*30+10
    });
}

function animate(){
    requestAnimationFrame(animate);

    ctx.fillStyle="black";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    /* ⭐ stars */
    for(let s of stars){
        ctx.beginPath();
        ctx.moveTo(s.x,s.y);
        ctx.lineTo(s.x+s.len,s.y+s.len);
        ctx.strokeStyle="white";
        ctx.stroke();

        s.x += s.speed;
        s.y += s.speed;

        if(s.y > canvas.height){
            s.x = Math.random()*canvas.width;
            s.y = -10;
        }
    }

    /* 💙 heart */
    for(let p of particles){
        p.x += (p.tx - p.x)*0.05;
        p.y += (p.ty - p.y)*0.05;

        ctx.fillStyle="#4fc3ff";
        ctx.fillRect(p.x,p.y,2,2);
    }
}
animate();

/* ===== GAME ===== */
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const noText = document.getElementById("noText");

let count = 0;
let ended = false;

/* 💔 messages */
const messages = [
    "😏 Pakka NO? Soch lo...",
    "🥺 Ek baar aur soch lo please?",
    "🧐 Galat button daba rahe ho!",
    "😜 Haath me nahi aane wala!",
    "😤 Itna bhaav kyu kha rahe ho?",
    "😭 Aisa karoge mere saath?"
];

function moveNo(){
    if(ended) return;

    const r = noBtn.getBoundingClientRect();

    let x = Math.random()*(window.innerWidth - r.width);
    let y = Math.random()*(window.innerHeight - r.height);

    noBtn.style.position="fixed";
    noBtn.style.left=x+"px";
    noBtn.style.top=y+"px";

    const msg = messages[Math.floor(Math.random()*messages.length)];
    noText.innerText = msg;
    noText.style.display="block";
    noText.style.left=x+"px";
    noText.style.top=(y-35)+"px";
}

noBtn.addEventListener("mouseover",moveNo);

/* 🎵 music */
let musicStarted=false;
function playMusic(){
    const m=document.getElementById("bgMusic");
    if(!musicStarted){
        m.currentTime=145;
        m.play();
        musicStarted=true;
    }
}

/* ✨ typing */
const text="💖 I didn’t plan to fall in love… But you became my favorite person ✨💫 I promise, no matter what happens… I will always choose you 💙";
let i=0;

function type(){
    if(i<text.length){
        document.getElementById("loveMsg").innerHTML += text[i];
        i++;
        setTimeout(type,30);
    }
}

noBtn.addEventListener("click",()=>{
    if(ended) return;

    count++;
    playMusic();

    document.getElementById("sadScreen").style.display="block";
    noBtn.style.display="none";

    if(count>=5){
        ended=true;
        document.getElementById("ui").style.display="none";
        document.getElementById("hopeScreen").style.display="block";
    }
});

yesBtn.addEventListener("click",()=>{
    ended=true;

    document.getElementById("ui").style.display="none";
    document.getElementById("yesScreen").style.display="block";

    playMusic();
    type();
});

window.addEventListener("resize",resize);

</script>
